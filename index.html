const V={};
const runwayGroups = [
 ['Setup costs', ['Flights, deposits and move-in costs', 'Entry paperwork and initial cover']],
 ['Monthly costs', ['Housing and utilities', 'Food, transport, work setup and health cover', 'UK commitments you’ll still pay']],
 ['Your runway', ['Emergency buffer and a return flight', 'Income you can rely on over the full 90 days', 'Savings available for the move']]
];
const runwayDraft = {};
function runwayField(key, label, numeric) {
 const type = numeric ? 'type="number" min="0" step="any" inputmode="decimal"' : 'type="text"';
 return '<label>' + label + '<input data-runway="' + key + '" ' + type + ' value="' + esc(runwayDraft[key] || '') + '"></label>';
}
function runwayResult() {
 const get = key => Number(runwayDraft[key]) || 0;
 const total = get('0-0') + get('0-1') + 3 * (get('1-0') + get('1-1') + get('1-2')) + get('2-0');
 const gap = total - get('2-1') - get('2-2');
 const fmt = n => new Intl.NumberFormat('en-GB', {maximumFractionDigits:2}).format(n);
 if (!Object.keys(runwayDraft).some(k => k.includes('-') && runwayDraft[k])) return '';
 return '90-day budget: ' + fmt(total) + ' · ' + (gap > 0 ? 'Still to cover: ' + fmt(gap) : 'Left over: ' + fmt(-gap));
}
