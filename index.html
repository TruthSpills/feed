   <div class="tg"><span>${esc(j.category||'')}</span><span>${esc(j.level||'')}</span></div>
   ${j.salary?`<div class="sal">${esc(j.salary)}</div>`:'<div class="sal un">Salary not listed</div>'}
   <a class="btn ghost sm" style="margin-top:12px" href="${esc(j.url)}" target="_blank" rel="noopener">View job</a></div>`).join('')
  :'<div class="card"><p>Loading jobs… if this stays here, check your connection.</p></div>'}
 <p class="note" style="margin:14px 2px 0">Roles are posted by the companies themselves. Always apply on their own page, and never pay anyone to apply.</p></div>
 ${foot()}`};

V.guide=()=>`<div class="hero"><div class="kick">The Arrival Kit</div><h1>What’s <em>inside.</em></h1>
 <p class="sub">66 pages, ten sections. Here’s every page — the padlocked ones open when you get the kit.</p></div>
 <h2>Free to read<span class="free-tag">Free</span></h2><div class="body">
 ${FREEBIES.map(f=>`<div class="card"><h3>${esc(f.t)}</h3><p>${esc(f.d)}</p>
  ${f.link?`<a class="btn ghost sm" style="margin-top:12px" href="${f.link[0]}" target="_blank" rel="noopener">${esc(f.link[1])}</a>`:''}</div>`).join('')}</div>
 <h2>A real page from the kit<span class="free-tag">Free</span></h2><div class="body">

V.sos=()=>`<div class="hero"><div class="kick">Emergency<span class="free-tag">Always free</span></div>
 <h1>Help in <em>Phuket.</em></h1><p class="sub">These numbers are free for everyone, kit or no kit. Save them now.</p></div>
 <div class="body">${SOS.map(([n,t])=>`<a class="offer" href="tel:${t}"><span class="ic">${ic('sos')}</span>
  <span class="t"><b>${esc(n)}</b><small>Tap to call ${esc(t)}</small></span><span class="go">&rsaquo;</span></a>`).join('')}

function foot(){return `<footer>Hack Thai by Truth Spills · Phuket<br>
 Some links are affiliate links — they cost you nothing extra.<br>
 <a href="${IG}" target="_blank" rel="noopener" style="color:var(--gold)">@truthspillsmentor</a></footer>`}

const TABS=[['home','Home','home'],['tours','Trips','tour'],['nights','Nights','night'],['jobs','Jobs','job'],['guide','Guide','book'],['sos','Help','sos']];
function render(){
 $('#main').innerHTML=(V[view]||V.home)();
 const hb=$('#hback'); if(hb)hb.hidden=(view==='home');
 $('#nav').innerHTML=TABS.map(([v,l,i])=>`<button data-go="${v}" class="${v===view?'on':''}">${ic(i)}${l}</button>`).join('');
}
function go(v,push){
 if(v===view)return;
 view=v;render();scrollTo(0,0);
 if(push!==false){try{history.pushState({v},'','#'+v)}catch(e){}}
}
try{history.replaceState({v:'home'},'','#home')}catch(e){}
addEventListener('popstate',e=>{
 const sh=document.querySelector('.shov'); if(sh){sh.remove();return}
 const sb=document.querySelector('.sheet'); if(sb){sb.remove();return}
 const v=(e.state&&e.state.v)||'home';
 if(v!==view){view=v;render();scrollTo(0,0)}
});
document.addEventListener('click',e=>{
 if(!e.target.closest('#hback'))return;
 if(history.length>1)history.back(); else go('home');
});
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return}
 if(e.target.closest('[data-tripedit]')){tripEdit=true;render();return}
 if(e.target.closest('[data-lock]')){sheet();return}
});
document.addEventListener('click',e=>{
 const t=e.target.closest&&e.target.closest('[data-tripshare],[data-shclose]'); if(!t)return;
 e.stopPropagation();
 if(t.hasAttribute('data-tripshare')){tripShare();return}
 const ov=t.closest('.shov'); if(ov)ov.remove();
},true);
document.addEventListener('submit',e=>{const f=e.target.closest('#tf'); if(!f)return; e.preventDefault();
 const v=$('#td').value; if(!tripOk(v))return;
 TRIP={date:v}; store.set('trip',TRIP); tripEdit=false; render(); scrollTo(0,0)});
function sheet(){
 const d=document.createElement('div'); d.className='sheet';
 d.innerHTML=`<div><h3>That one’s in the Arrival Kit</h3>
  <p>66 pages of what actually works in Phuket — the scams, the real prices, the beaches worth the drive, and a clickable island map. Written by someone who lives here.</p>
  <a class="btn" href="${BUY}">Get the Arrival Kit</a>
  <div class="row"><button class="btn ghost" data-close>Keep looking</button></div></div>`;
 d.addEventListener('click',ev=>{if(ev.target===d||ev.target.closest('[data-close]'))d.remove()});
 document.body.appendChild(d);
}
render(); loadJobs();
</script></body></html>
