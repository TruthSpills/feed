<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Assessment referral · Hack Thai</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#211425;color:#fff5e9;font:17px/1.55 system-ui,sans-serif}main{max-width:37rem;margin:auto;padding:2rem 1.25rem}a{color:#ffc4b4}h1{font-size:clamp(2rem,8vw,3rem);line-height:1.05}label{display:block;margin:1rem 0}input,button,.btn{font:inherit;border-radius:.65rem;padding:.8rem;width:100%}button,.btn{display:block;background:#ffd0ae;color:#281726;border:0;text-align:center;text-decoration:none;font-weight:750;cursor:pointer;margin:.8rem 0}input[type=checkbox]{width:auto}small{color:#f5c7bd}dl{border-left:3px solid #ffac94;padding-left:1rem}dd{margin:0 0 .5rem;overflow-wrap:anywhere}dt{font-weight:bold}[hidden]{display:none!important}@media print{body{background:white;color:black}a,button,.screen{display:none!important}main{padding:0}}
</style><main><a class="screen" href="/#cannabis-assessment">‹ Help and health</a><h1>Assessment referral</h1>
<section id="intro"><p>The <strong>฿888</strong> fee covers your medical assessment and your medical certificate if approved.</p><p>A qualified clinician will carry out your assessment. They’ll take your details and ask about your symptoms.</p><button id="begin">Get started</button></section>
<form hidden><label>Full name as shown on your passport<input required name="patient" autocomplete="name" maxlength="100"></label><label>Nationality<input required name="nationality" maxlength="100"></label><label>Email for the clinician’s reply<input required name="email" type="email" autocomplete="email" maxlength="254"></label><label><input required type="checkbox"> I agree to send these details via WhatsApp for referral to the clinician, who may contact me.</label><button id="next">Review referral</button></form>
<section id="summary" hidden><h2 id="heading">Review your request</h2><dl></dl><p id="note"></p><button id="pay">Pay ฿888</button><button id="edit">Edit details</button><button id="send" hidden>Send my referral on WhatsApp</button><button id="pdf" hidden>Print or save referral PDF</button></section><p role="status" id="status"></p></main>
<script>
const $=s=>document.querySelector(s), form=$('form'), key='ht-referral-intake-v1';
const checkout=new URL('https://buy.stripe.com/3cI9AT2c5dDd6sY95h2VG0l');
const url=new URL(location.href);
const returned=/^cs_live_[A-Za-z0-9]+$/.test(url.searchParams.get('session_id')||'');
let details={},sessionId=returned?url.searchParams.get('session_id'):'';
if(returned)history.replaceState(null,'',location.pathname+'#return');
try {
 const saved=JSON.parse(sessionStorage.getItem(key)||'null');
 if(saved && saved.until>Date.now())details=saved;else sessionStorage.removeItem(key);
}catch{}
if(location.hash==='#return' && !sessionId)sessionId=details.sessionId||'';
if(sessionId && details.ref){details.sessionId=sessionId;try{sessionStorage.setItem(key,JSON.stringify(details))}catch{}}
function screen(el){for(const s of [$('#intro'),form,$('#summary')])s.hidden=s!==el;window.scrollTo(0,0)}
function edit(){for(const name of ['patient','nationality','email'])form.elements[name].value=details[name]||'';screen(form);form.elements.patient.focus()}
function summary(){
 screen($('#summary'));const post=Boolean(sessionId);
 $('#heading').textContent=post?'Send your referral':'Review your request';
 $('#note').textContent=post?'Open WhatsApp and tap Send to submit your referral.':'One referral · ฿888 THB. After checkout you’ll return here to send your details.';
 const list=$('dl');list.replaceChildren();
 for(const [label,value] of [['Name',details.patient],['Nationality',details.nationality],['Contact email',details.email],['Referral reference',details.ref||sessionId]]){
 const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;list.append(dt,dd)}
 $('#pay').hidden=post;$('#pdf').hidden=$('#send').hidden=!post;
}
$('#begin').onclick=$('#edit').onclick=edit;
form.onsubmit=e=>{e.preventDefault();for(const input of form.querySelectorAll('[name]'))input.value=input.value.trim();if(!form.reportValidity())return;
 details={...details,...Object.fromEntries(new FormData(form)),ref:details.ref||(sessionId?'':crypto.randomUUID()),sessionId,until:Date.now()+3600000};summary()};
$('#pay').onclick=()=>{try{sessionStorage.setItem(key,JSON.stringify(details))}catch{$('#status').textContent='Open this page in Safari or Chrome to keep your details during checkout.';return}
 checkout.searchParams.set('client_reference_id',details.ref);location.assign(checkout)};
$('#send').onclick=()=>{const msg=['Assessment referral','Name: '+details.patient,'Nationality: '+details.nationality,'Contact email: '+details.email,'Payment reference: '+sessionId];if(details.ref)msg.push('Referral reference: '+details.ref);location.assign('https://wa.me/447903845563?text='+encodeURIComponent(msg.join('\n')))};
$('#pdf').onclick=()=>window.print();
if(sessionId){if(details.patient)summary();else{edit();$('#status').textContent='Enter your contact details to send your request. You do not need to pay again.'}}
</script></html>
